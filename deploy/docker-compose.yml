# ==============================================================================
# SAKSHI - 2-CONTAINER DEPLOYMENT TOPOLOGY
# Zone 1 (LSP Private): sakshi-lsp
# Zone 3 (Lender / RE): sakshi-lender (Node API + Mock LMS + Static Frontends)
# ==============================================================================
version: '3.8'

networks:
  lsp_net:
    driver: bridge
  lender_net:
    driver: bridge

volumes:
  lsp_data:
  lender_data:
  circuit_artifacts:

services:
  # ============================================================================
  # CONTAINER 1: LSP PRIVATE ZONE (Model + Prover Sidecar + Outbox)
  # ============================================================================
  sakshi-lsp:
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
    image: sakshi-lsp:latest
    container_name: sakshi-lsp
    networks:
      - lsp_net
      - lender_net    # Outbound only connection to sakshi-lender
    ports: []         # ZERO public ports. Completely isolated inside LSP VPC.
    environment:
      - SAKSHI_SIDECAR_LENDER_NODE_URL=http://sakshi-lender:8000
      - SAKSHI_SIDECAR_SIDECAR_API_KEY=${SIDECAR_API_KEY:?Set SIDECAR_API_KEY to a strong secret before starting the stack}
      - SAKSHI_SIDECAR_POLICY_ID=${POLICY_ID:-pol_nbfc42_lspX_personal_v1}
      - SAKSHI_SIDECAR_NUM_WORKERS=2
      - SAKSHI_SIDECAR_DB_PATH=/app/data/sidecar.db
    volumes:
      - lsp_data:/app/data
      - circuit_artifacts:/app/circuits/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      sakshi-lender:
        condition: service_healthy

  # ============================================================================
  # CONTAINER 2: LENDER / REGULATED ENTITY ZONE (All-in-One Lender Appliance)
  # Contains: Lender Node Verifier API + Append-Only Ledger + Mock LMS + React Frontends
  # ============================================================================
  sakshi-lender:
    build:
      context: ..
      dockerfile: node/Dockerfile
    image: sakshi-lender:latest
    container_name: sakshi-lender
    networks:
      - lender_net
    ports:
      - "127.0.0.1:8000:8000"   # Local-only entrypoint: APIs, Lender Dashboard, Borrower DLA
    environment:
      - SAKSHI_NODE_DATABASE_URL=sqlite+aiosqlite:////app/data/sakshi.db
      - SAKSHI_NODE_SIDECAR_API_KEY=${SIDECAR_API_KEY:?Set SIDECAR_API_KEY to a strong secret before starting the stack}
      - SAKSHI_NODE_LENDER_ADMIN_KEY=${LENDER_ADMIN_KEY:?Set LENDER_ADMIN_KEY to a strong secret before starting the stack}
      - SAKSHI_NODE_MOCK_VERIFY=${MOCK_VERIFY:-false}
    volumes:
      - lender_data:/app/data
      - circuit_artifacts:/app/circuits/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
